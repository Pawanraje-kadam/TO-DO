<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism To-Do</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <main class="glass-app">
    <header>
      <h1>My Tasks</h1>
      <p id="task-counter">0 tasks pending</p>
    </header>
    <div class="input-section">
      <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off">
      <button id="add-btn" aria-label="Add Task">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>
    <ul id="task-list"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
