<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glass Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!-- Animated background orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <main class="container">

    <!-- Header -->
    <header class="glass-header">
      <div class="header-left">
        <div class="logo-icon">✦</div>
        <div>
          <h1 class="app-title">Glass Tasks</h1>
          <p class="app-date" id="currentDate"></p>
        </div>
      </div>
      <div class="header-stats">
        <div class="stat-pill">
          <span class="stat-num" id="totalCount">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-pill done-pill">
          <span class="stat-num" id="doneCount">0</span>
          <span class="stat-label">Done</span>
        </div>
      </div>
    </header>

    <!-- Progress bar -->
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <span class="progress-label" id="progressLabel">0% complete</span>
    </div>

    <!-- Input area -->
    <div class="glass-input-card">
      <div class="input-row">
        <div class="input-wrap">
          <span class="input-icon">+</span>
          <input
            type="text"
            id="taskInput"
            class="task-input"
            placeholder="Add a new task..."
            maxlength="100"
            autocomplete="off"
          />
        </div>
        <select id="prioritySelect" class="priority-select">
          <option value="low">🟢 Low</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="high">🔴 High</option>
        </select>
        <input
  type="date"
  id="dueDateInput"
  class="due-date-input"
  aria-label="Due date"
/>
        <button class="add-btn" id="addBtn">Add Task</button>
      </div>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="active">Active</button>
      <button class="tab" data-filter="completed">Completed</button>
      <button class="tab danger-tab" id="clearBtn">Clear Done</button>
    </div>

    <!-- Task list -->
    <div class="task-list" id="taskList"></div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">✦</div>
      <p class="empty-title">No tasks here</p>
      <p class="empty-sub">Add something above to get started</p>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
